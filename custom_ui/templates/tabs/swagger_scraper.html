<!-- Swagger UI Scraper Tab Content -->
<div class="method-description">
    <h3>Swagger UI Scraper</h3>
    <p>Extracts data by scraping the Swagger UI interface using browser automation.</p>
    <ul>
        <li>✅ Works when only UI is accessible</li>
        <li>⚠️ Slower (1-5 minutes)</li>
        <li>⚠️ Requires browser automation</li>
    </ul>
</div>
<div class="input-section">
    <label for="uiUrlInput">Swagger UI URL:</label>
    <input
        type="url"
        id="uiUrlInput"
        placeholder="https://petstore.swagger.io/"
        value="https://petstore.swagger.io/"
    >
    <div class="scraper-controls" style="display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
            <label for="swaggerDefaultFileNameCheckbox" style="display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: #fff;">
                <input type="checkbox" id="swaggerDefaultFileNameCheckbox" onchange="updateSwaggerScraperControls()" style="accent-color: #00d4ff;">
                Set Default File Name
            </label>
            <input
                type="text"
                id="swaggerFilePrefixInput"
                placeholder="Enter file name prefix"
                value=""
                oninput="updateSwaggerScraperControls()"
                style="padding: 8px 10px; border-radius: 5px; border: 1px solid rgba(0, 212, 255, 0.3); background: #0a0e27; color: #fff; max-width: 250px;"
            >
            <a id="swaggerClearPrefixLink" onclick="clearSwaggerPrefix()" style="color: #00d4ff; cursor: pointer; text-decoration: underline; font-size: 0.9rem; opacity: 0.5; pointer-events: none;">
                Clear Custom Prefix
            </a>
        </div>
        <button id="runUiScraperBtn" onclick="runUiScraper()" disabled style="padding: 8px 14px; font-size: 0.85rem; background: rgba(0, 212, 255, 0.2); color: rgba(255, 255, 255, 0.4); border: 1px solid rgba(0, 212, 255, 0.3); border-radius: 5px; cursor: not-allowed; transition: all 0.3s ease;">
            ▶️ Run UI Scraper
        </button>
    </div>
</div>
