<!-- OpenAPI JSON Parser Tab Content -->
<div class="method-description">
    <h3>OpenAPI JSON Parser</h3>
    <p>Directly parses the OpenAPI/Swagger JSON specification.</p>
    <ul>
        <li>✅ Fast (~1 second)</li>
        <li>✅ No browser required</li>
        <li>✅ More reliable</li>
    </ul>
</div>
<div class="input-section">
    <label for="jsonUrlInput">OpenAPI Spec URL:</label>
    <input
        type="url"
        id="jsonUrlInput"
        placeholder="https://petstore.swagger.io/v2/swagger.json"
        value="https://petstore.swagger.io/v2/swagger.json"
    >
    
    <div class="or-separator" style="margin: 10px 0; text-align: center; color: #888;">— OR —</div>
    
    <label for="jsonFileInput">Upload OpenAPI JSON File:</label>
    <input
        type="file"
        id="jsonFileInput"
        accept=".json"
    >
    
    <div class="parser-controls" style="display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
            <label for="jsonDefaultFileNameCheckbox" style="display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: #fff;">
                <input type="checkbox" id="jsonDefaultFileNameCheckbox" onchange="updateJsonParserControls()" style="accent-color: #00d4ff;">
                Set Default File Name
            </label>
            <input
                type="text"
                id="jsonFilePrefixInput"
                placeholder="Enter file name prefix"
                value=""
                oninput="updateJsonParserControls()"
                style="padding: 8px 10px; border-radius: 5px; border: 1px solid rgba(0, 212, 255, 0.3); background: #0a0e27; color: #fff; max-width: 250px;"
            >
            <a id="jsonClearPrefixLink" onclick="clearJsonPrefix()" style="color: #00d4ff; cursor: pointer; text-decoration: underline; font-size: 0.9rem; opacity: 0.5; pointer-events: none;">
                Clear Custom Prefix
            </a>
        </div>
        <button id="runJsonParserBtn" onclick="runJsonParser()" disabled style="padding: 8px 14px; font-size: 0.85rem; background: rgba(0, 212, 255, 0.2); color: rgba(255, 255, 255, 0.4); border: 1px solid rgba(0, 212, 255, 0.3); border-radius: 5px; cursor: not-allowed; transition: all 0.3s ease;">
            ▶️ Run JSON Parser
        </button>
    </div>
</div>
