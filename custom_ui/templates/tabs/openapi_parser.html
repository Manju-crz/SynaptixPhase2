<!-- OpenAPI JSON Parser Tab Content -->
<div class="method-description">
    <h3>OpenAPI JSON Parser</h3>
    <p>Directly parses the OpenAPI/Swagger JSON specification.</p>
    <ul>
        <li>✅ Fast (~1 second)</li>
        <li>✅ No browser required</li>
        <li>✅ More reliable</li>
    </ul>
</div>
<div class="input-section">
    <label for="jsonUrlInput">OpenAPI Spec URL:</label>
    <input
        type="url"
        id="jsonUrlInput"
        placeholder="https://petstore.swagger.io/v2/swagger.json"
        value="https://petstore.swagger.io/v2/swagger.json"
    >
    <button id="runJsonParserBtn" onclick="runJsonParser()">
        ▶️ Run JSON Parser
    </button>
</div>
